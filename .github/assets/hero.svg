<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Two magma laws go in and one machine-checked Lean certificate comes out: a proof when the implication holds, a finite counterexample when it fails">
<rect width="1200" height="460" fill="#FAFBFC"/>
<rect x="0" y="0" width="10" height="460" fill="#8250DF"/>
<text x="56" y="62" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8250DF" font-weight="600" text-anchor="start" letter-spacing="0.34em">EQUATIONAL IMPLICATION</text>
<text x="56" y="104" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#12141A" font-weight="600" text-anchor="start">Does one magma law force another?</text>
<text x="56" y="136" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#4A5663" font-weight="400" text-anchor="start">Every answer ships a certificate a machine can check.</text>
<rect x="56" y="182" width="330" height="196" rx="10" fill="#FFFFFF" stroke="#D8DEE6"/>
<text x="80" y="216" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7684" font-weight="600" text-anchor="start" letter-spacing="0.28em">GIVEN</text>
<text x="80" y="254" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6B7684" font-weight="400" text-anchor="start">Equation 1</text>
<text x="80" y="282" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="22" fill="#12141A" font-weight="500" text-anchor="start">x = x ◇ y</text>
<text x="80" y="316" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6B7684" font-weight="400" text-anchor="start">Equation 2</text>
<text x="80" y="344" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="22" fill="#12141A" font-weight="500" text-anchor="start">x = x ◇ x</text>
